name: Maintain inactive pull requests

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview maintenance without changing pull requests
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: stale-prs
  cancel-in-progress: false

jobs:
  maintain:
    if: github.repository == 'Draculabo/AntigravityManager'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@3467b6485bf80d2be20f30ec1a3d2d2aea0330e9
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 60
          days-before-pr-close: 14
          stale-pr-label: stale
          exempt-pr-labels: keep-open
          remove-pr-stale-when-updated: true
          delete-branch: false
          operations-per-run: 30
          debug-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          stale-pr-message: >-
            This pull request has had no activity for 60 days. It will be closed
            after another 14 days without activity. Comment or update it to keep
            it active, or add the keep-open label to exempt it from maintenance.
          close-pr-message: >-
            Closing this pull request after 60 days of inactivity and a 14-day
            reminder period. Its branch has been preserved. You can reopen it
            when work resumes.
