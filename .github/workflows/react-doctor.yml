name: React Doctor

on:
  workflow_call:

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REACT_DOCTOR_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Analyze changed React code
        uses: millionco/react-doctor@v2
        with:
          blocking: error
          scope: lines
