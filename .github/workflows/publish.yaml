name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify artifacts without writing to GitHub Release'
        required: false
        type: boolean
        default: true
      allow_update_published_release:
        description: 'Allow uploading assets to an already published release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm libsecret-1-dev pkg-config

      - name: Ensure WiX Toolset
        if: matrix.platform == 'win32' && matrix.arch == 'x64'
        shell: powershell
        run: |
          $installed = choco list --local-only wixtoolset --exact --limit-output
          if (-not $installed) {
            choco install wixtoolset --version=3.14.0 -y
          } elseif ($installed -match '^wixtoolset\|3\.14(\.|$)') {
            Write-Host "WiX Toolset already compatible: $installed"
          } else {
            Write-Host "Incompatible WiX Toolset detected: $installed"
            choco upgrade wixtoolset --version=3.14.0 --allow-downgrade -y
          }

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 20
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - name: Check Linux AppImage maker and update downloads
        if: matrix.platform == 'linux'
        run: pnpm run test:appimage-download

      - name: Make Artifacts
        if: matrix.platform != 'darwin'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          AGM_OTEL_DEBUG: 'false'
          OTEL_TRACES_EXPORTER: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT != '' && 'otlp' || 'none' }}
          OTEL_METRICS_EXPORTER: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT != '' && 'otlp' || 'none' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_SERVICE_NAME: ${{ secrets.OTEL_SERVICE_NAME || 'antigravity-manager' }}
          OTEL_RESOURCE_ATTRIBUTES: ${{ secrets.OTEL_RESOURCE_ATTRIBUTES || 'service.namespace=desktop,deployment.environment=production' }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: pnpm run make --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Audit Windows x64 package size
        if: matrix.platform == 'win32' && matrix.arch == 'x64'
        run: pnpm run audit:size:win32:x64

      - name: Make NSIS automatic-update installer
        if: matrix.platform == 'win32'
        run: pnpm run make:nsis ${{ matrix.arch }}

      # DMG creation may be flaky on GitHub macOS runners, so retry the full darwin make.
      - name: Make Artifacts (darwin with retry)
        if: matrix.platform == 'darwin'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 20
          retry_wait_seconds: 20
          command: pnpm run make --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          AGM_OTEL_DEBUG: 'false'
          OTEL_TRACES_EXPORTER: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT != '' && 'otlp' || 'none' }}
          OTEL_METRICS_EXPORTER: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT != '' && 'otlp' || 'none' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_SERVICE_NAME: ${{ secrets.OTEL_SERVICE_NAME || 'antigravity-manager' }}
          OTEL_RESOURCE_ATTRIBUTES: ${{ secrets.OTEL_RESOURCE_ATTRIBUTES || 'service.namespace=desktop,deployment.environment=production' }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: make-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            out/make/**/*.exe
            out/make/**/*.dmg
            out/make/**/*.zip
            out/make/**/*.AppImage
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.msi
            out/make/**/*.nupkg
            out/make/**/*.yml
            out/make/**/*.txt
            out/make/**/RELEASES
          if-no-files-found: error
          retention-days: 14
          archive: true

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: |
          echo "Dry run enabled: uploaded artifacts will be verified; release publish step will be skipped."

  verify-artifacts:
    name: Verify Release Artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout build revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read build artifact inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/build-artifacts.json"

      - name: Download Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: make-*
          merge-multiple: true
          path: release-assets
          digest-mismatch: error

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile --prod=false --ignore-scripts

      - name: Validate downloaded release assets
        run: |
          pnpm run test:acceptance release artifacts \
            --source release-assets --inventory "$RUNNER_TEMP/build-artifacts.json"

      - name: Prepare Windows update feed without publication
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/prepare-windows-update-feed.mjs \
            --source release-assets \
            --output "$RUNNER_TEMP/verified-windows-update-feed" \
            --release-tag "v$version" \
            --repository "$GITHUB_REPOSITORY"

  publish:
    name: Publish Release (Manual Approval)
    needs: [build, verify-artifacts]
    runs-on: ubuntu-24.04
    if: needs.build.result == 'success' && needs.verify-artifacts.result == 'success' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
    permissions:
      contents: write
      pull-requests: write
    # Configure the `release` environment with required reviewers in GitHub settings
    # to enforce a manual approval gate before assets are uploaded.
    environment:
      name: release

    steps:
      - name: Checkout git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: make-*
          merge-multiple: true
          path: release-assets
          digest-mismatch: error

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install publish dependencies
        run: pnpm install --frozen-lockfile --prod=false --ignore-scripts

      - name: Test Windows update feed generation
        run: pnpm run test:acceptance installers feed

      - name: Validate release assets
        run: pnpm run test:acceptance release artifacts --source release-assets

      - name: Resolve release tag
        id: release_tag
        env:
          RELEASE_EVENT_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          if [ -n "$RELEASE_EVENT_TAG" ]; then
            tag="$RELEASE_EVENT_TAG"
          else
            version="$(node -e "const v=require('./package.json').version; if (!v) { throw new Error('package.json version is empty'); } process.stdout.write(v);")"
            tag="v$version"
          fi

          if [ -z "$tag" ]; then
            echo "::error::Resolved release tag is empty"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $tag"

      - name: Ensure release is safe to update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          ALLOW_UPDATE_PUBLISHED_RELEASE: ${{ github.event_name == 'release' && 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.allow_update_published_release) || 'false' }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ] && [ "$ALLOW_UPDATE_PUBLISHED_RELEASE" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already published. Refusing to upload assets."
              echo "::error::Re-run with workflow_dispatch input allow_update_published_release=true if you explicitly want to update it."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --draft --notes "Automated release draft."
          fi

      - name: Generate updater metadata
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName,body,publishedAt,url > "$RUNNER_TEMP/updater-release.json"
          node scripts/generate-updater-metadata.mjs \
            --release-file "$RUNNER_TEMP/updater-release.json" \
            --output release-assets/updater.json

      - name: Prepare Windows static update feed
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          node scripts/prepare-windows-update-feed.mjs \
            --source release-assets \
            --output windows-update-feed \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY"

      - name: Prepare legacy Windows x64 release feed
        run: |
          mkdir -p github-release-assets
          cp windows-update-feed/win32/x64/RELEASES github-release-assets/RELEASES

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          mapfile -t files < <(find release-assets -type f \( \
            -name '*.exe' -o \
            -name '*.dmg' -o \
            -name '*.zip' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.msi' -o \
            -name '*.nupkg' -o \
            -name '*.yml' -o \
            -name '*.json' -o \
            -name '*.txt' \
          \) | sort)
          files+=("github-release-assets/RELEASES")

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release assets found under release-assets/"
            exit 1
          fi

          printf 'Uploading %s assets to %s\n' "${#files[@]}" "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

      - name: Publish Windows static update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          branch_dir="$(mktemp -d)"
          git init "$branch_dir"
          git -C "$branch_dir" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git -C "$branch_dir" fetch --depth=1 origin release-updates; then
            git -C "$branch_dir" checkout -B release-updates FETCH_HEAD
          else
            git -C "$branch_dir" checkout --orphan release-updates
          fi

          find "$branch_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R windows-update-feed/. "$branch_dir"/

          git -C "$branch_dir" config user.name "github-actions[bot]"
          git -C "$branch_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$branch_dir" add -A

          if git -C "$branch_dir" diff --cached --quiet; then
            echo "Windows static update feed unchanged."
            exit 0
          fi

          git -C "$branch_dir" commit -m "chore: update Windows update feed for ${RELEASE_TAG}"
          git -C "$branch_dir" push origin HEAD:release-updates

      - name: Update Linux package metadata from release checksums
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          amd64_checksums="$(find release-assets -type f -name 'sha256sums-linux-amd64.txt' | head -n 1)"
          aarch64_checksums="$(find release-assets -type f -name 'sha256sums-linux-aarch64.txt' | head -n 1)"

          if [ -z "$amd64_checksums" ] || [ -z "$aarch64_checksums" ]; then
            echo "::error::Missing Linux checksum files required to update package metadata"
            exit 1
          fi

          node scripts/update-flake-release.mjs \
            --version "$version" \
            --amd64-checksums "$amd64_checksums" \
            --arm64-checksums "$aarch64_checksums"

          node scripts/update-arch-release.mjs \
            --version "$version" \
            --amd64-checksums "$amd64_checksums" \
            --pkgbuild packaging/arch/PKGBUILD

      - name: Remove downloaded release assets
        run: rm -rf release-assets

      - name: Create Linux package metadata pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN }}
          base: main
          branch: chore/update-linux-packaging-${{ steps.release_tag.outputs.tag }}
          add-paths: |
            flake.nix
            packaging/arch/PKGBUILD
          delete-branch: true
          title: 'chore(linux): update package metadata to ${{ steps.release_tag.outputs.tag }}'
          commit-message: 'chore(linux): update package metadata to ${{ steps.release_tag.outputs.tag }}'
          body: |
            Update `flake.nix` and the Arch Linux `PKGBUILD` to match `${{ steps.release_tag.outputs.tag }}` release assets.

            The hashes come from the Linux checksum files generated during the release build.
